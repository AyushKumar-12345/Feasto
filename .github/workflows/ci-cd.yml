name: Feasto CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test & Build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ------------------------------------------------------------------------
      # Backend Verification
      # ------------------------------------------------------------------------
      - name: Cache Backend Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Automated Tests
        working-directory: backend
        run: npm test

      # ------------------------------------------------------------------------
      # Frontend Verification
      # ------------------------------------------------------------------------
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Linting
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

      # ------------------------------------------------------------------------
      # Admin Dashboard Verification
      # ------------------------------------------------------------------------
      - name: Install Admin Dependencies
        working-directory: admin
        run: npm ci

      - name: Run Admin Linting
        working-directory: admin
        run: npm run lint

      - name: Build Admin Production Bundle
        working-directory: admin
        run: npm run build

  docker-build:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-and-build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: feasto-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: feasto-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Admin Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: false
          tags: feasto-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

