services:
  # Local development database (persistent, isolated to container network)
  mongodb:
    image: mongo:7-jammy
    container_name: feasto-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: feasto
    volumes:
      - feasto_mongodb_data:/data/db
    networks:
      - feasto-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend REST API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feasto-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      # Uses local container MongoDB by default, or external MongoDB Atlas if set in root .env
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/feasto}
      JWT_SECRET: ${JWT_SECRET:-feasto_local_docker_dev_secret_change_in_production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@feasto.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:5174}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_SECRET_KEY: ${CLOUDINARY_SECRET_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - feasto-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Customer-facing React frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:5174}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
        VITE_FORMSPREE_FORM_ID: ${VITE_FORMSPREE_FORM_ID}
    container_name: feasto-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - feasto-network

  # Restaurant management React admin dashboard
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-http://localhost:5173}
    container_name: feasto-admin
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - feasto-network

volumes:
  feasto_mongodb_data:
    name: feasto_mongodb_data

networks:
  feasto-network:
    name: feasto-network
    driver: bridge
